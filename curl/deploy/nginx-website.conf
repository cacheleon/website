# Terminal clients (curl and friends) asking for / get the black hole
# animation from curl-blackhole instead of the HTML homepage.
map $http_user_agent $terminal_client {
    default 0;
    "~*(curl|httpie|xh/|wget|powershell)" 1;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name cacheleon.dev www.cacheleon.dev;
    absolute_redirect off;

    root /var/www/site;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = / {
        if ($terminal_client) {
            rewrite ^ /__curl last;
        }
        try_files $uri $uri/ $uri.html =404;
    }

    location = /__curl {
        internal;
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 150s;
        gzip off;
    }
}
